<title>Front Office '97</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first front-office app — sticky scoreboard header, one scrolling column, fixed tab bar. Scorecard paper by day, ballpark scoreboard by night. */
:root{
  --bg:#e9eeea; --paper:#fbfcfa; --ink:#13241b; --muted:#5b6b62; --line:#cdd8d0; --soft:#dfe7e1;
  --accent:#b5341f; --accent-ink:#fff; --gold:#9a6f0c; --good:#2b7a47; --bad:#b5341f;
  --board:#13241b; --board-ink:#f2f5ef; --board-dim:#9fb3a7;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1511; --paper:#14201a; --ink:#e8eee6; --muted:#93a59a; --line:#253429; --soft:#1b2a22;
  --accent:#ef7150; --accent-ink:#1a0d08; --gold:#e2b13f; --good:#5fc489; --bad:#ef7150;
  --board:#070d0a; --board-ink:#f4f7f1; --board-dim:#8aa094; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1511; --paper:#14201a; --ink:#e8eee6; --muted:#93a59a; --line:#253429; --soft:#1b2a22;
  --accent:#ef7150; --accent-ink:#1a0d08; --gold:#e2b13f; --good:#5fc489; --bad:#ef7150;
  --board:#070d0a; --board-ink:#f4f7f1; --board-dim:#8aa094; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
.app{max-width:680px;margin:0 auto;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--board);color:var(--board-ink);padding:10px 16px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.brand{font:800 22px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand span{color:var(--accent)}
.date{font:600 12px/1.2 var(--mono);color:var(--board-dim);text-transform:uppercase;letter-spacing:.06em}
.top .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,var(--board-ink) 25%,transparent);border-radius:999px;padding:4px 10px 4px 4px;font:600 13px var(--body);background:transparent;color:var(--board-ink);cursor:pointer;max-width:48vw}
.chip img{width:22px;height:22px;border-radius:50%}
.tag{font:600 11px/1 var(--mono);letter-spacing:.04em;padding:3px 6px;border-radius:4px;background:var(--soft);color:var(--ink);white-space:nowrap}
.tag.red{background:var(--accent);color:var(--accent-ink)}
.tag.gold{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold)}
.abbr{font:800 15px/1 var(--display);letter-spacing:.04em}
main{padding:14px 16px 0;display:flex;flex-direction:column;gap:16px}
section.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card>h2,.h2{font:800 19px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;margin:0;padding:13px 14px 9px;display:flex;align-items:center;gap:8px;text-wrap:balance}
.card>h2 .sub,.h2 .sub{font:500 12px var(--body);text-transform:none;letter-spacing:0;color:var(--muted);margin-left:auto}
.pad{padding:0 14px 14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 13px;font-weight:600;cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;min-height:32px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,select:focus-visible,.tab:focus-visible,.chip:focus-visible,.lnk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon{width:32px;height:32px;min-height:32px;padding:0;display:inline-grid;place-items:center;font:600 14px var(--mono)}
select{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 8px;min-height:36px;max-width:100%}
.seg{display:flex;background:var(--soft);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:7px 8px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.lnk{background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--soft);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:14px}
th:last-child,td:last-child{padding-right:14px}
td.name{font-family:var(--body);white-space:normal;min-width:120px}
tr.mine td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
tr:last-child td{border-bottom:0}
/* scoreboard */
.board{background:var(--board);color:var(--board-ink);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.board .big{font:800 30px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.board .meta{font:600 12px var(--mono);color:var(--board-dim);letter-spacing:.06em;text-transform:uppercase}
.board .btn{background:transparent;color:var(--board-ink);border-color:color-mix(in srgb,var(--board-ink) 30%,transparent)}
.board .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.prog{height:6px;background:color-mix(in srgb,var(--board-ink) 18%,transparent);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);width:0}
.scores{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;padding:0 14px 14px}
.score{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);cursor:pointer;text-align:left;display:grid;gap:3px}
.score .ln{display:flex;justify-content:space-between;font:600 14px var(--mono)}
.score .ln.w{color:var(--ink)} .score .ln.l{color:var(--muted)}
.score .f{font:500 11px var(--mono);color:var(--muted)}
.mineScore{border-color:var(--accent)}
/* list rows */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--soft)}
.item:first-child{border-top:0}
.item.stack{grid-template-columns:auto 1fr}
.item.stack .ctrls{grid-column:2/-1;justify-content:flex-start}
@media (max-width:440px){.city{display:none}}
.item.mine{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.item .nm{min-width:0}
.item .nm b{font-weight:600}
.item .nm .s{font:400 12px var(--mono);color:var(--muted);display:block;margin-top:1px}
.ovr{font:800 20px/1 var(--display);width:38px;height:34px;display:grid;place-items:center;border-radius:6px;background:var(--soft)}
.ovr.hi{background:color-mix(in srgb,var(--gold) 25%,transparent);color:var(--gold)}
.ovr.top{background:var(--accent);color:var(--accent-ink)}
.slot{font:600 12px var(--mono);color:var(--muted);width:24px;text-align:center}
.ctrls{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.news{display:flex;flex-direction:column;gap:0}
.news div{padding:8px 14px;border-top:1px solid var(--soft);font-size:14px;display:flex;gap:10px}
.news div:first-child{border-top:0}
.news .d{font:600 11px var(--mono);color:var(--muted);min-width:46px;padding-top:2px}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs .in{display:flex;max-width:680px;width:100%}
.tab{flex:1;min-width:0;white-space:nowrap;border:0;background:none;padding:6px 1px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);font:600 11px var(--body);letter-spacing:.02em}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab[aria-current="page"]{color:var(--accent)}
/* modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgb(0 0 0/.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:680px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .hd{position:sticky;top:0;background:var(--paper);display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--line);z-index:1}
.sheet .hd h3{margin:0;font:800 22px/1.05 var(--display);text-transform:uppercase;letter-spacing:.03em;flex:1;min-width:0}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;padding:12px 14px}
.bars .lab{font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.bar i.hi{background:var(--gold)} .bar i.top{background:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));border-top:1px solid var(--line);overflow:hidden}
.kv div{background:var(--paper);padding:10px 14px;border-bottom:1px solid var(--line);box-shadow:1px 0 0 var(--line)}
.kv b{display:block;font:600 18px var(--mono);font-variant-numeric:tabular-nums}
.kv span{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.meter{display:grid;gap:6px;padding:12px 14px;border-top:1px solid var(--soft)}
.meter .track{height:10px;border-radius:5px;background:var(--soft);position:relative;overflow:hidden}
.meter .track i{position:absolute;inset:0 auto 0 0;background:var(--good)}
.warn{color:var(--bad);font-size:13px}
.ok{color:var(--good);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--board);color:var(--board-ink);padding:10px 14px;border-radius:8px;z-index:60;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgb(0 0 0/.25)}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}
.check{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--soft);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.bracket{display:grid;gap:10px;padding:0 14px 14px}
.bracket .rd{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ser{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:600 14px var(--mono)}
.av{width:20px;height:20px;border-radius:50%;vertical-align:middle}
.price{display:flex;align-items:center;gap:10px}
.price b{font:800 34px/1 var(--display);min-width:90px;text-align:center}
/* sim bar */
.simrow{flex-basis:100%;border-top:1px solid color-mix(in srgb,var(--board-ink) 14%,transparent);padding-top:8px}
.simin{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.simstat{font:600 12px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--board-dim);flex:1;min-width:140px}
.simbtns{display:flex;gap:6px;flex-wrap:wrap}
.simbtns .btn{min-height:34px;padding:6px 11px;font-size:13px;background:transparent;color:var(--board-ink);border-color:color-mix(in srgb,var(--board-ink) 30%,transparent)}
.simbtns .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.simprog{display:flex;align-items:center;gap:10px;font:600 12px var(--mono);color:var(--board-dim);min-width:200px}
.simprog .prog{flex:1;min-width:90px}
.sidebrand{display:none}
/* office */
.pill{font:600 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.pill.goodc{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warnc{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.spark{width:140px;height:40px;flex:none}
.sliders{display:grid;gap:6px}
.sliders input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.nextup{display:grid;gap:2px}
.nextup .btn{justify-self:start;margin-top:6px}
.cols{display:grid;gap:16px}
.card.alert{border-color:var(--accent)}
/* trades */
.split{display:grid;gap:16px}
.table-deal{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-block:1px solid var(--line)}
.table-deal>div{background:var(--paper);padding:10px 14px;display:grid;gap:6px;align-content:start;min-width:0}
.table-deal .lab{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.table-deal .tag{white-space:normal;display:inline-block;margin:0 4px 4px 0}
.cashrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hintbox,.feedback{border-radius:8px;padding:10px 12px;font-size:14px}
.hintbox{background:color-mix(in srgb,var(--gold) 12%,transparent)}
.hintbox ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.feedback.nob{background:color-mix(in srgb,var(--bad) 10%,transparent)}
.feedback.okb{background:color-mix(in srgb,var(--good) 12%,transparent)}
.check.on{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.fanmeter{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,color-mix(in srgb,var(--bad) 35%,var(--soft)),var(--soft) 45%,color-mix(in srgb,var(--good) 35%,var(--soft)))}
.fanmeter i{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--accent);opacity:.85}
.fanmeter b{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;background:var(--ink);border-radius:2px}
.drivers{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.goodt{color:var(--good);font-weight:600}.badt{color:var(--bad);font-weight:600}
.tvopt{display:grid;gap:4px;text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);color:var(--ink);font:inherit;cursor:pointer}
.tvopt.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.tvopt:disabled{cursor:default}.tvopt:disabled:not(.on){opacity:.6}
.tvopt .tag{justify-self:start}
input[type=search]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.diag{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;padding:12px 14px 0}
.diag .lab{font:600 12px var(--mono);min-width:64px}
.dbar{height:10px;border-radius:5px;background:var(--soft);position:relative;overflow:hidden}
.dbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.dbar i{position:absolute;inset:0 auto 0 0;background:var(--muted);border-radius:5px}
.dbar i.g{background:var(--good)}.dbar i.b{background:var(--bad)}
.idea{border-top:1px solid var(--soft);padding:12px 14px;display:grid;gap:6px}
.pnl td:not(:first-child),.pnl th:not(:first-child){text-align:right;font-family:var(--mono)}
.pnl tr.sec td{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:12px}
.pnl tr.tot td{font-weight:700;border-top:1px solid var(--line)}
.pnl tr.big td{font-size:16px;border-top:2px solid var(--ink)}
.race td:not(.name),.race th:not(.name){text-align:right;font-family:var(--mono)}
.race th span{color:var(--muted);font-weight:400}
.race td.now,.race th.now{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.racechart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.race td.name .s{display:block;font-size:12px;color:var(--muted);white-space:normal}
.race td.name{min-width:118px}
.race th,.race td{padding-left:6px;padding-right:6px}
@media (max-width:480px){.race th span{display:none}.race{font-size:12px}.race th,.race td{padding-left:4px;padding-right:4px}.race td.name{min-width:104px}}
.rubric summary{cursor:pointer;list-style:none;padding:14px 14px 4px}
.rubric summary h2{padding:0!important;display:inline-flex}
.rubric summary::-webkit-details-marker{display:none}
.rubric summary h2::after{content:" ▾";font-size:14px;color:var(--muted)}
.rubric h4{margin:14px 0 4px;font:700 13px var(--mono);text-transform:uppercase;letter-spacing:.05em}
.rubric ul{margin:0;padding-left:18px;display:grid;gap:4px}
.rubric p{margin:0}
.advice{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;background:color-mix(in srgb,var(--gold) 5%,var(--paper))}
.advice ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.advice li.good::marker{content:"▲ ";color:var(--good)}
.advice li.bad::marker{content:"▼ ";color:var(--bad)}
.grip{width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:grab;touch-action:none;flex:none}
.grip svg{width:18px;height:18px;fill:currentColor}
.grip:hover,.grip:focus-visible{background:var(--soft);color:var(--ink)}
.dragghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;display:flex;gap:10px;align-items:center;box-sizing:border-box;width:min(340px,calc(100vw - 16px));padding:8px 12px;background:var(--paper);color:var(--ink);border:1.5px solid var(--accent);border-radius:12px;box-shadow:0 12px 32px rgb(0 0 0/.28)}
.dragghost b{font-weight:700}
.draghint{font:600 12px var(--mono);color:var(--accent);margin-top:3px}
.ctrls .grip{margin-left:auto}
.benchctl{flex-wrap:nowrap!important;width:100%}
.benchctl select{width:0;min-width:0;flex:1 1 120px;max-width:200px}
.benchctl .btn{flex:none}
.draghint.no{color:var(--muted)}
.item.dragsrc{opacity:.35}
.dragging-on,.dragging-on *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
.droptarget{outline:2px dashed var(--accent);outline-offset:-3px;background:color-mix(in srgb,var(--accent) 10%,transparent)!important;border-radius:8px}
.list[data-zone]{min-height:44px}
.item.rec{background:color-mix(in srgb,var(--gold) 8%,transparent)}
.notes{border-color:var(--accent);animation:notein .35s ease}
@keyframes notein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.note{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--soft)}
.note.big{display:block;padding:10px 0 4px}
.note.big .nhead{display:flex;gap:10px;align-items:center;padding:0 14px 6px}
.note.big .nhead b{flex:1}
.note .nm b{font-weight:600}
.note .nbtn{grid-column:2/-1;display:flex;gap:6px}
.note{align-items:start}.note .nx{margin-top:-4px}
.note .nm .s{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.note.t-bad .dic{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.note.t-good .dic{background:color-mix(in srgb,#2f8f5b 18%,transparent);color:#2f8f5b}
.note.t-warn .dic{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold)}
.nx{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:14px;flex:none}
.nx:hover,.nx:focus-visible{background:var(--soft);color:var(--ink)}
.tbcard{border:2px solid var(--gold);overflow:hidden}
