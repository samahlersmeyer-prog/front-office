<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="description" content="Sunday GM: fantasy football with real players and simulated Sundays."><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="../icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Sunday GM"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}body{margin:0}</style>
<title>Sunday GM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0c1410">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a stadium-night scoreboard. Turf-dark ground, chalk text, and the broadcast first-down line (yellow) as the one accent.
   Bottom tab bar on phones, left rail on desktop; one column of cards that reads like a game program. */
:root {
  --bg: #0c1410; --surface: #121e18; --raise: #182821; --line: #24382d; --ink: #ecf3ed; --muted: #92a69a; --dim: #6b7f73;
  --yellow: #f2d50f; --on-yellow: #141a05; --turf: #1d6b3f; --turf-ink: #c9f2d6; --good: #45d07c; --bad: #ff6a5c; --warn: #ffb547;
  --qb: #ff7d95; --rb: #45d07c; --wr: #5db6ff; --te: #ffb547; --k: #c7a0ff; --def: #a8bcae;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px rgba(0,0,0,.35);
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #eef2ec; --surface: #ffffff; --raise: #f5f8f3; --line: #d9e1d8; --ink: #0f1d16; --muted: #55685c; --dim: #7c8d82;
  --yellow: #f2d50f; --on-yellow: #141a05; --turf: #1d6b3f; --turf-ink: #0f3d22; --good: #138a45; --bad: #d23a2d; --warn: #b86e00;
  --qb: #c8304f; --rb: #138a45; --wr: #1c6fc4; --te: #b86e00; --k: #7b4fd1; --def: #4f6457;
  --shadow: 0 1px 2px rgba(15,29,22,.06), 0 8px 24px rgba(15,29,22,.07); color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #eef2ec; --surface: #ffffff; --raise: #f5f8f3; --line: #d9e1d8; --ink: #0f1d16; --muted: #55685c; --dim: #7c8d82;
  --yellow: #f2d50f; --on-yellow: #141a05; --turf: #1d6b3f; --turf-ink: #0f3d22; --good: #138a45; --bad: #d23a2d; --warn: #b86e00;
  --qb: #c8304f; --rb: #138a45; --wr: #1c6fc4; --te: #b86e00; --k: #7b4fd1; --def: #4f6457;
  --shadow: 0 1px 2px rgba(15,29,22,.06), 0 8px 24px rgba(15,29,22,.07); color-scheme: light; }
* { box-sizing: border-box }
html, body { background: var(--bg); color: var(--ink) }
body { font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; min-height: 100vh }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg) }
button, input, select, textarea { font: inherit; color: inherit }
h1, h2, h3 { font-family: var(--display); letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.05 }
.num, .score, td.n { font-variant-numeric: tabular-nums }
.app { display: grid; min-height: 100vh }
/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.topin { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; max-width: 1100px; margin: 0 auto }
.brand { font: 900 24px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; display: flex; align-items: center; gap: 8px }
.brand i { display: inline-block; width: 22px; height: 4px; background: var(--yellow); transform: skewX(-20deg); border-radius: 1px }
.spacer { flex: 1 }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-weight: 600; font-size: 14px; cursor: pointer; min-height: 38px }
.chip:hover { border-color: var(--muted) }
.chip svg { flex: none }
.ichip { padding: 7px 10px; position: relative }
.dot { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; border-radius: 99px; background: var(--bad); color: #fff; font: 700 11px/18px var(--body); text-align: center; padding: 0 5px }
.weekbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; max-width: 1100px; margin: 8px auto 0 }
.weekbar .lbl { font: 800 15px/1 var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.play { display: inline-flex; align-items: center; gap: 8px; border: 0; background: var(--yellow); color: var(--on-yellow); font: 800 18px/1 var(--display); text-transform: uppercase; letter-spacing: .04em; padding: 10px 16px; border-radius: 10px; cursor: pointer; min-height: 42px }
.play:disabled { opacity: .5; cursor: default }
.play small { font: 600 12px var(--body); text-transform: none; letter-spacing: 0; opacity: .75 }
/* main */
main { width: 100%; max-width: 1100px; margin: 0 auto; padding-block: 14px 110px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; align-content: start }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); min-width: 0 }
.card > h2, .hd { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px 8px; font-size: 22px; text-transform: uppercase }
.hd .sub, .card > h2 .sub { margin-left: auto; font: 500 13px var(--body); text-transform: none; color: var(--muted); letter-spacing: 0 }
.pad { padding: 0 16px 16px }
.muted { color: var(--muted) } .small { font-size: 13px } .tiny { font-size: 12px }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--raise); border-radius: 10px; padding: 9px 14px; font-weight: 600; cursor: pointer; min-height: 40px; text-decoration: none }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--turf); border-color: var(--turf); color: #fff }
.btn.yellow { background: var(--yellow); border-color: var(--yellow); color: var(--on-yellow) }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted) }
.btn.sm { min-height: 32px; padding: 5px 10px; font-size: 13px; border-radius: 8px }
.btn.danger { color: var(--bad) }
.btn:disabled { opacity: .45; cursor: default }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px }
.seg { display: flex; gap: 4px; background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 4px; overflow-x: auto; scrollbar-width: none }
.seg button { flex: 1 0 auto; border: 0; background: transparent; padding: 8px 12px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; white-space: nowrap }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.25) }
.pos { display: inline-grid; place-items: center; min-width: 38px; height: 22px; padding: 0 6px; border-radius: 6px; font: 800 13px/1 var(--display); letter-spacing: .05em; color: var(--bg); flex: none }
.pos.QB { background: var(--qb) } .pos.RB { background: var(--rb) } .pos.WR { background: var(--wr) } .pos.TE { background: var(--te) } .pos.K { background: var(--k) } .pos.DEF { background: var(--def) } .pos.FLEX { background: linear-gradient(90deg, var(--rb), var(--wr) 50%, var(--te)) } .pos.BN { background: var(--line); color: var(--muted) }
.tag { display: inline-flex; align-items: center; gap: 4px; font: 700 11px/1 var(--body); padding: 4px 6px; border-radius: 6px; background: var(--raise); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; text-transform: uppercase; letter-spacing: .04em }
.tag.out { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); border-color: transparent }
.tag.bye { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); border-color: transparent }
.tag.mine { background: color-mix(in srgb, var(--yellow) 22%, transparent); color: var(--ink); border-color: transparent }
.tag.good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); border-color: transparent }
/* lists */
.list { display: grid }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); min-width: 0 }
.item:first-child { border-top: 0 }
button.item { width: 100%; text-align: left; background: transparent; border-left: 0; border-right: 0; border-bottom: 0; cursor: pointer }
button.item:hover { background: var(--raise) }
.nm { min-width: 0; flex: 1; display: grid; gap: 1px }
.nm b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700 }
.nm .lk { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tkn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.nm .s { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.pts { font: 800 22px/1 var(--display); min-width: 52px; text-align: right; font-variant-numeric: tabular-nums }
.pts small { display: block; font: 600 11px var(--body); color: var(--muted); margin-top: 2px }
.slotlab { width: 46px; flex: none; font: 800 13px/1 var(--display); letter-spacing: .06em; color: var(--muted); text-transform: uppercase }
/* scoreboard hero */
.board { background: radial-gradient(120% 140% at 50% -20%, color-mix(in srgb, var(--turf) 55%, var(--surface)) 0%, var(--surface) 60%); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 12px; position: relative; overflow: hidden }
.board::after { content: ""; position: absolute; left: 0; right: 0; bottom: 56px; height: 3px; background: var(--yellow); opacity: .9; transform: skewY(-1deg) }
.eyebrow { font: 800 13px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--turf-ink) }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px }
.vs .t { display: grid; gap: 4px; min-width: 0 }
.vs .t:last-child { text-align: right; justify-items: end }
.vs .tn { font: 800 20px/1.05 var(--display); text-transform: uppercase; overflow-wrap: anywhere }
.vs .rec { font-size: 12.5px; color: var(--muted) }
.vs .sc { font: 900 46px/1 var(--display); font-variant-numeric: tabular-nums }
.vs .mid { font: 800 14px var(--display); color: var(--muted); letter-spacing: .1em }
.wp { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; display: flex }
.wp i { display: block; height: 100%; background: var(--yellow) }
.wpl { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted) }
.board .actions { position: relative; z-index: 1; display: flex; gap: 8px; flex-wrap: wrap }
/* alerts */
.alert { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-top: 1px solid var(--line) }
.alert:first-child { border-top: 0 }
.alert .ic { width: 30px; height: 30px; flex: none; border-radius: 8px; display: grid; place-items: center; font-weight: 800; background: var(--raise) }
.alert.warn .ic { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn) }
.alert.bad .ic { background: color-mix(in srgb, var(--bad) 22%, transparent); color: var(--bad) }
.alert.good .ic { background: color-mix(in srgb, var(--good) 22%, transparent); color: var(--good) }
.alert .tx { flex: 1; min-width: 0 }
/* tables */
.scroll { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: 14px }
th { text-align: left; font: 700 12px var(--body); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap }
tr.me td { background: color-mix(in srgb, var(--yellow) 9%, transparent) }
tr.cut td { border-bottom: 2px dashed var(--yellow) }
td.n, th.n { text-align: right }
/* tabs */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; justify-content: space-around; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)) }
.tab { flex: 1; display: grid; justify-items: center; gap: 2px; border: 0; background: transparent; color: var(--muted); font: 600 11.5px var(--body); padding: 6px 2px; border-radius: 10px; cursor: pointer; position: relative; max-width: 120px }
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.tab[aria-current="page"] { color: var(--ink) }
.tab[aria-current="page"]::after { content: ""; position: absolute; top: -7px; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--yellow) }
.tab .dot { top: 0; right: 22% }
@media (min-width: 960px) {
  .app { grid-template-columns: 210px 1fr }
  nav.tabs { position: sticky; top: 0; height: 100vh; flex-direction: column; justify-content: flex-start; gap: 4px; border-top: 0; border-right: 1px solid var(--line); padding: 18px 12px; grid-row: 1 / span 2; grid-column: 1 }
  .tab { flex: 0 0 auto; grid-auto-flow: column; justify-content: start; align-items: center; gap: 10px; font-size: 15px; padding: 10px 12px; max-width: none }
  .tab[aria-current="page"] { background: var(--raise) }
  .tab[aria-current="page"]::after { top: 10px; bottom: 10px; left: 0; right: auto; width: 3px; height: auto; border-radius: 0 3px 3px 0 }
  .tab .dot { position: static; margin-left: auto }
  .top, main { grid-column: 2 }
  .railbrand { display: flex !important; padding: 0 8px 14px }
  .top .brand { display: none }
  main { padding-bottom: 40px }
}
.railbrand { display: none }
/* modal */
#modal { position: fixed; inset: 0; z-index: 50; display: grid; align-items: end; justify-items: center }
#modal[hidden] { display: none }
.scrim { position: absolute; inset: 0; background: rgba(4,8,6,.6); backdrop-filter: blur(2px) }
.sheet { position: relative; width: min(640px, 100%); max-height: min(88vh, 900px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.4); padding-bottom: env(safe-area-inset-bottom, 0px); animation: up .22s ease-out }
@media (min-width: 700px) { #modal { align-items: center } .sheet { border-radius: 20px } }
@keyframes up { from { transform: translateY(24px); opacity: .6 } to { transform: none; opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none } * { scroll-behavior: auto !important } }
.sheet .shd { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--line) }
.sheet .shd h3 { font-size: 24px; text-transform: uppercase; flex: 1 }
.x { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--raise); cursor: pointer; font-size: 18px }
#toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; max-width: min(92vw, 460px); box-shadow: 0 10px 30px rgba(0,0,0,.35) }
@media (min-width: 960px) { #toast { bottom: 24px } }
/* forms */
input[type=text], input[type=search], input[type=number], select, textarea { width: 100%; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 42px }
textarea { resize: vertical }
label.f { display: grid; gap: 6px; font-weight: 600; font-size: 14px }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px }
.opt { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 3px; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--raise) }
.opt b { font: 800 18px/1.1 var(--display); text-transform: uppercase }
.opt span { font-size: 12.5px; color: var(--muted) }
.opt.on { border-color: var(--yellow); box-shadow: inset 0 0 0 1.5px var(--yellow) }
.opt:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px }
/* draft */
.clock { display: grid; gap: 6px; padding: 16px; border-radius: 16px; background: var(--raise); border: 1px solid var(--line) }
.clock.you { background: color-mix(in srgb, var(--yellow) 16%, var(--surface)); border-color: var(--yellow) }
.clock .big { font: 900 30px/1 var(--display); text-transform: uppercase }
.picks { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 14px; scrollbar-width: thin }
.pk { flex: none; width: 140px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: grid; gap: 4px; background: var(--raise) }
.pk .no { font: 700 11px var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: .05em }
.pk b { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.need { display: flex; gap: 6px; flex-wrap: wrap }
/* watch */
.ticker { display: grid; gap: 6px; max-height: 260px; overflow: auto; padding: 0 16px 14px }
.tk { display: flex; gap: 8px; align-items: center; font-size: 14px; animation: up .3s ease-out }
.tk .q { font: 800 12px var(--display); color: var(--muted); width: 26px }
.final { font: 900 28px/1 var(--display); text-transform: uppercase; text-align: center; padding: 6px 0 14px }
.final.win { color: var(--good) } .final.loss { color: var(--bad) }
/* bracket */
.bracket { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; padding: 0 16px 16px }
.bround { display: grid; gap: 8px; align-content: start }
.bround h4 { margin: 0; font: 800 14px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
.bm { border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.bm div { display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px; font-size: 14px }
.bm div + div { border-top: 1px solid var(--line) }
.bm .w { font-weight: 700; background: color-mix(in srgb, var(--good) 10%, transparent) }
.empty { padding: 26px 16px; text-align: center; color: var(--muted) }
.hero2 { display: grid; gap: 10px; padding: 22px 18px; border-radius: 18px; border: 1px solid var(--line); background: linear-gradient(160deg, color-mix(in srgb, var(--turf) 40%, var(--surface)), var(--surface) 70%); position: relative; overflow: hidden }
.hero2 h1 { font-size: clamp(38px, 9vw, 64px); text-transform: uppercase; line-height: .92 }
.hero2 h1 em { font-style: normal; color: var(--yellow) }
.hero2 p { margin: 0; max-width: 56ch; color: var(--muted) }
.yardlines { position: absolute; inset: 0; pointer-events: none; opacity: .09; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 64px) }
.lk { color: var(--ink); text-decoration: underline; text-decoration-color: var(--yellow); text-underline-offset: 3px; background: none; border: 0; padding: 0; cursor: pointer; font-weight: 600 }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 54px; padding: 0 16px }
.bars i { flex: 1; background: var(--turf); border-radius: 3px 3px 0 0; min-height: 2px }
.bars i.hi { background: var(--yellow) }
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; padding: 0 16px 14px }
.stat { background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px }
.stat span { display: block; font-size: 12px; color: var(--muted) }
.stat b { font: 800 24px/1.1 var(--display); font-variant-numeric: tabular-nums }
</style>
</head><body>
<div class="app">
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <header class="top">
    <div class="topin">
      <div class="brand"><i aria-hidden="true"></i>Sunday GM</div>
      <span class="spacer"></span>
      <button class="chip ichip" type="button" data-act="fb" aria-label="Send feedback" title="Send feedback"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.8.6 1.1 1.3 1.1 2.2h5c0-.9.3-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg><span class="dot" id="fbDot" hidden></span></button>
      <button class="chip ichip" type="button" data-act="search" aria-label="Find a player"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <button class="chip" type="button" id="lgChip" data-act="leagues" hidden></button>
    </div>
    <div class="weekbar" id="weekbar" hidden></div>
  </header>

    teamsArr().forEach(t => { const d = T[t.id], auto = d.auto !== false || !t.owner; lus[t.id] = auto ? S.bestLineup(W, d.roster, w, sc(), out) : lineupFrom(d, w, out); });

    // 4. fantasy matchups
    const pairs = w <= REG() ? (fsched()[w] || []) : ((S2.po && S2.po.rounds && S2.po.rounds[w]) || []);
    const score = tid => Math.round(lus[tid].reduce((a, id) => a + (id ? (wkPts[id] || 0) : 0), 0) * 10) / 10;
    const mu = pairs.map(([a, b]) => [a, b, score(a), score(b)]);
    S2.std = S2.std || {};
    if (w <= REG()) for (const [a, b, sa, sb] of mu) {
      const ra = S2.std[a] || (S2.std[a] = [0, 0, 0, 0, 0]), rb = S2.std[b] || (S2.std[b] = [0, 0, 0, 0, 0]);
      if (sa > sb) { ra[0]++; rb[1]++; } else if (sb > sa) { rb[0]++; ra[1]++; } else { ra[2]++; rb[2]++; }
      ra[3] = Math.round((ra[3] + sa) * 10) / 10; ra[4] = Math.round((ra[4] + sb) * 10) / 10; rb[3] = Math.round((rb[3] + sb) * 10) / 10; rb[4] = Math.round((rb[4] + sa) * 10) / 10;
    }

    for (const id in res.hurt) { out[id] = res.hurt[id]; if (own[id]) news.push([w, `${P[id].name} (${P[id].team}) is hurt and out about ${res.hurt[id]} week${res.hurt[id] > 1 ? 's' : ''}.`, 'inj', own[id]]); }

      const hi = mu.flatMap(m => [[m[0], m[2]], [m[1], m[3]]]).sort((a, b) => b[1] - a[1])[0];
      news.push([w, `${tname(hi[0])} put up the week's high score: ${f1(hi[1])}.`, 'res', hi[0]]);
      if (big.d > 30) { const m = big.m, wn = m[2] > m[3] ? 0 : 1; news.push([w, `Blowout: ${tname(m[wn])} crushed ${tname(m[1 - wn])} by ${f1(big.d)}.`, 'res', m[wn]]); }

  const rows = teamsArr().map(t => { const r = (S2.std || {})[t.id] || [0, 0, 0, 0, 0]; return { id: t.id, pct: (r[0] + r[2] / 2) / Math.max(1, r[0] + r[1] + r[2]), pf: r[3] }; }).sort((a, b) => b.pct - a.pct || b.pf - a.pf);
  const n = meta.size === 8 ? 4 : 6, seeds = rows.slice(0, n).map(r => r.id), rounds = {};
  if (n === 4) { rounds[16] = [[seeds[0], seeds[3]], [seeds[1], seeds[2]]]; }
  else { rounds[15] = [[seeds[2], seeds[5]], [seeds[3], seeds[4]]]; }
  return { seeds, rounds, champ: null };
}
function advancePlayoffs(S2, w, mu) {
  const po = S2.po, seedOf = id => po.seeds.indexOf(id);
  const winners = mu.map(m => (m[2] > m[3] || (m[2] === m[3] && seedOf(m[0]) < seedOf(m[1])) ? m[0] : m[1]));
  if (w === 15 && meta.size !== 8) {
    const alive = [po.seeds[0], po.seeds[1]].concat(winners).sort((a, b) => seedOf(a) - seedOf(b));
    po.rounds[16] = [[alive[0], alive[3]], [alive[1], alive[2]]];
  } else if (w === 16) { po.rounds[17] = [[winners[0], winners[1]].sort((a, b) => seedOf(a) - seedOf(b))]; }
  else if (w === 17) { po.champ = winners[0]; const m = mu[0]; po.runner = m[0] === winners[0] ? m[1] : m[0]; }
  if (w === 15 && meta.size === 8) { /* bye week for the bracket in 8-team leagues */ po.rounds[16] = po.rounds[16] || []; }
}

// ---------------- moves: lineup, claims, drops, trades ----------------
async function setLineup(lu) { const t = myTid(); if (!t) return; await dref('tm/' + t).update({ lu, auto: false }); }
async function setAuto(on) { const t = myTid(); if (!t) return; await dref('tm/' + t).update({ auto: on, lu: on ? null : lineupFor(t) }); toast(on ? 'Autopilot on: your best lineup is set every week.' : 'You set the lineup now.'); }
async function swapSlot(i, pid) {
  const t = myTid(); const lu = lineupFor(t).slice(), j = lu.indexOf(pid);
  if (j >= 0) { // swapping two starters
    if (!S.fits(P[pid].pos, S.SLOTS[i]) || (lu[i] && !S.fits(P[lu[i]].pos, S.SLOTS[j]))) { toast('Those two can\'t trade spots.'); return; }
    [lu[i], lu[j]] = [lu[j], lu[i]];
  } else lu[i] = pid;
  await setLineup(lu); closeModal(); toast(`${P[pid].name} is in your lineup.`);
}
async function claim(add, drop, bid) {
  const t = myTid(); if (!t) return;
  const d = tms[t] || {}, cl = (d.claims || []).filter(c => c.add !== add).concat([{ add, drop: drop || null, bid: Math.max(0, Math.min(d.faab || 0, Math.round(bid || 0))) }]);
  await dref('tm/' + t).update({ claims: cl });
  closeModal(); toast(`Claim placed. It goes through when Week ${curWeek()} is played.`);
}
async function cancelClaim(add) { const t = myTid(), d = tms[t] || {}; await dref('tm/' + t).update({ claims: (d.claims || []).filter(c => c.add !== add) }); }
async function dropPlayer(pid) {
  const t = myTid(), d = tms[t]; if (!d) return;
  await dref('tm/' + t).update({ roster: d.roster.filter(x => x !== pid), lu: Array.isArray(d.lu) ? d.lu.map(x => (x === pid ? null : x)) : d.lu });
  closeModal(); toast(`${P[pid].name} is now a free agent.`);
}
function tradeCheck(from, to, give, get) {
  const a = rosterOf(from).filter(x => !give.includes(x)).concat(get), b = rosterOf(to).filter(x => !get.includes(x)).concat(give);
  if (!give.length || !get.length) return 'Pick at least one player on each side.';
  if (a.length > S.ROSTER) return `You'd have ${a.length} players. The limit is ${S.ROSTER}. Send one more or ask for one less.`;
  if (b.length > S.ROSTER) return `They'd have ${b.length} players. The limit is ${S.ROSTER}.`;
  if (curWeek() > REG()) return 'Trades are closed for the playoffs.';
  return '';
}
async function proposeTrade(to, give, get) {
  const from = myTid(); const err = tradeCheck(from, to, give, get); if (err) { toast(err); return; }
  const t = teamById(to), id = newId('tr');
  const rec = { from, to, give, get, ts: Date.now(), status: 'pending', week: curWeek() };
  if (!t.owner) {
    const v = S.cpuAcceptsTrade(W, rk(), give, get, rosterOf(to));
    rec.status = v.ok ? 'accepted' : 'declined'; rec.why = v.why;
    await put('tr/' + id, rec);
    if (v.ok) { await executeTrade(rec); toast(`${t.name} accepted!`); } else toast(`${t.name}: “${v.why}”`);
  } else { await put('tr/' + id, rec); toast(`Offer sent to ${t.gm || t.name}.`); }
  closeModal();
}
async function executeTrade(t) {
  const a = clone(tms[t.from]), b = clone(tms[t.to]);
  a.roster = a.roster.filter(x => !t.give.includes(x)).concat(t.get); b.roster = b.roster.filter(x => !t.get.includes(x)).concat(t.give);
  const fix = d => (Array.isArray(d.lu) ? d.lu.map(x => (x && d.roster.includes(x) ? x : null)) : d.lu);
  await dref('tm/' + t.from).update({ roster: a.roster, lu: fix(a) }); await dref('tm/' + t.to).update({ roster: b.roster, lu: fix(b) });
  const S2 = clone(st); S2.news = [[curWeek(), `Trade: ${tname(t.from)} send ${t.give.map(x => P[x].name).join(', ')} to ${tname(t.to)} for ${t.get.map(x => P[x].name).join(', ')}.`, 'move', t.from]].concat(S2.news || []).slice(0, 150);
  await put('x/state', S2);
}
async function answerTrade(id, yes) {
  const t = trades.find(x => x.id === id); if (!t || t.status !== 'pending') return;
  if (yes) {
    const still = t.give.every(x => rosterOf(t.from).includes(x)) && t.get.every(x => rosterOf(t.to).includes(x));
    const err = still ? tradeCheck(t.from, t.to, t.give, t.get) : 'Those rosters have changed since the offer.';
    if (err) { await put('tr/' + id, Object.assign({}, t, { status: 'void', why: err })); toast(err); return; }
    await executeTrade(t);
  }
  await put('tr/' + id, Object.assign({}, t, { id: undefined, status: yes ? 'accepted' : 'declined' }));
  toast(yes ? 'Trade done.' : 'Offer declined.');
}

async function newSeason() {
  if (!isCommish()) return;
  const seed = (Math.random() * 4294967295) >>> 0;
  for (const t of teamsArr()) await put('tm/' + t.id, { roster: [], lu: null, auto: true, faab: 100, claims: [] });
  await put('x/state', { std: {}, out: {}, pts: {}, news: [], res: {}, po: null });
  try { await dref('x/draft').delete(); } catch (e) { /* none */ }
  await saveMeta({ seed, season: (meta.season || 1) + 1, phase: 'lobby', week: 1 });
  closeModal(); toast('New season. Everyone redrafts. Start the draft when the league is ready.');
}

    case 'autodraft': { const t = myTid(), d = clone(draft); d.auto = Object.assign({}, d.auto, { [t]: !(d.auto && d.auto[t]) }); await put('x/draft', d); break; }
    case 'dpos': dPos = el.dataset.v; render(); break;
    case 'fastdraft': fastDraft = true; afterChange(); break;
    case 'ppos': pPos = el.dataset.v; render(); break;
    case 'pwho': pWho = el.dataset.v; render(); break;
    case 'psort': pSort = el.dataset.v; render(); break;
    case 'lsub': lSub = el.dataset.v; render(); break;
    case 'play': playWeek(); break;
    case 'player': openPlayer(pid); break;
    case 'slot': openSlot(+el.dataset.i); break;
    case 'start': openStart(pid); break;
    case 'swap': await swapSlot(+el.dataset.i, pid); break;
    case 'fixlu': { const t = myTid(); await setLineup(coach(t).best); toast('Lineup fixed: your best projected starters are in.'); break; }
    case 'mweek': mWeek = Math.max(1, Math.min(LASTWK, (mWeek || viewWeek()) + +el.dataset.d)); render(); break;
    case 'watch': openWatch(+el.dataset.w); break;
    case 'wskip': if (watchRun) watchRun.skip(); break;
    case 'claimopen': openClaim(pid); break;
    case 'claimgo': await claim(pid, $('#drop') ? $('#drop').value : '', +$('#bid').value); break;
    case 'unclaim': await cancelClaim(pid); break;
    case 'dropask': openModal(`Drop ${P[pid].name}?`, `<div class="pad" style="padding-top:12px;display:grid;gap:12px"><p class="small" style="margin:0">He goes straight to free agency, and anyone can claim him next week.</p><button class="btn danger" type="button" data-act="dropgo" data-p="${esc(pid)}">Drop ${esc(P[pid].name)}</button></div>`); break;
    case 'dropgo': await dropPlayer(pid); break;
    case 'tradewith': openTrade(el.dataset.t); break;
    case 'tradefor': { const own = ownerMap()[pid]; if (own) openTrade(own, pid); break; }
    case 'tradego': el.disabled = true; await proposeTrade(trDraft.to, trDraft.give, trDraft.get); break;
    case 'tans': if (el.dataset.v === 'x') { const t = trades.find(x => x.id === el.dataset.id); await put('tr/' + t.id, Object.assign({}, t, { id: undefined, status: 'withdrawn' })); } else await answerTrade(el.dataset.id, el.dataset.v === '1'); break;
    case 'unused': break;
    case 'invite': openModal('Invite friends', `<div class="pad" style="padding-top:12px;display:grid;gap:10px"><textarea id="invT" rows="4" readonly>${esc(inviteText())}</textarea><button class="btn primary" type="button" data-act="copyinv">Copy invite</button></div>`); break;
    case 'copyinv': { const t = $('#invT'); try { await navigator.clipboard.writeText(t.value); toast('Copied.'); } catch (x) { t.select(); toast('Selected. Copy it from here.'); } break; }
    case 'rename': openModal('Rename your team', `<div class="pad" style="padding-top:12px;display:grid;gap:10px"><input type="text" id="rnT" maxlength="28" value="${esc(tname(myTid()))}" aria-label="Team name"><button class="btn primary" type="button" data-act="renamego">Save</button></div>`); break;
    case 'renamego': { const v = $('#rnT').value.trim(); if (!v) break; const teams = clone(meta.teams); teams.find(t => t.id === myTid()).name = v.slice(0, 28); await saveMeta({ teams }); closeModal(); break; }
    case 'renameLg': openModal('Rename league', `<div class="pad" style="padding-top:12px;display:grid;gap:10px"><input type="text" id="rnL" maxlength="40" value="${esc(meta.name)}" aria-label="League name"><button class="btn primary" type="button" data-act="renameLgGo">Save</button></div>`); break;
    case 'renameLgGo': { const v = $('#rnL').value.trim(); if (!v) break; await saveMeta({ name: v.slice(0, 40) }); if (!meta.solo && mode === 'shared') { try { await db.doc(ROOT + '/idx/' + lid).update({ name: v.slice(0, 40) }); } catch (x) { /* optional */ } } closeModal(); break; }
    case 'newseasonask': openModal('Start a new season?', `<div class="pad" style="padding-top:12px;display:grid;gap:12px"><p class="small" style="margin:0">Everyone keeps their team and name, rosters are cleared, and you redraft. Records start at 0-0. Past champions stay in History.</p><button class="btn danger" type="button" data-act="newseason">Start a new season</button></div>`); break;
    case 'newseason': await newSeason(); break;
    case 'leave': { const r = db.doc(ROOT + '/u/' + me.id), s = await r.get(); const cur = (s.exists && s.data().lids) || []; await r.set({ lids: cur.filter(x => x !== lid) }); lid = null; meta = null; lsSet('lid', ''); unsubs.forEach(f => f()); unsubs = []; render(); toast('Removed from your list. The league itself is untouched.'); break; }
    case 'search': openSearch(); break;
    case 'fb': openModal('Feedback', '', 'fb'); paintFb(); break;
    case 'fbk': { const t = $('#fbText'); if (t) fbDraft = t.value; fbKind = el.dataset.v; paintFb(); break; }
    case 'fbsend': { const t = $('#fbText'); if (t) fbDraft = t.value; await sendFb(); break; }
    case 'fbdone': try { await db.doc('feedback/' + el.dataset.id).update({ done: true }); } catch (x) { toast('Could not update.'); } break;
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'dQ') { dQ = el.value.trim().toLowerCase(); const pos = el.selectionStart; render(); const n = $('#dQ'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  if (el.id === 'pQ') { pQ = el.value.trim().toLowerCase(); const pos = el.selectionStart; render(); const n = $('#pQ'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  if (el.id === 'gQ') $('#gRes').innerHTML = searchResults(el.value);
  if (el.id === 'fbText') fbDraft = el.value;
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'autoT') setAuto(el.checked);
  if (el.dataset && el.dataset.tr && trDraft) { const k = el.dataset.tr, s = new Set(trDraft[k]); if (el.checked) s.add(el.value); else s.delete(el.value); trDraft[k] = [...s]; paintTrade(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
boot();
})();
</script>
</body></html>
